<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assinatura RH</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <img
            src="logo.png"
            alt="Logo UPA Del Castilho"
            class="logo"
        >


        <!-- TÍTULO -->

        <h2>
            Assinatura Digital
        </h2>


        <!-- DESCRIÇÃO -->

        <p class="descricao">
            Assine para validar as informações enviadas
        </p>


        <!-- MATRÍCULA -->

        <label for="matricula">
            Matrícula
        </label>

        <input
            type="text"
            id="matricula"
            placeholder="Digite sua matrícula"
            autocomplete="off"
        >


        <!-- TIPO DE DOCUMENTO -->

        <label for="tipoDocumento">
            Tipo de Documento
        </label>

        <select
            id="tipoDocumento"
            required
        >

            <option
                value=""
                selected
                disabled
            >
                Selecione o tipo de documento
            </option>

            <option value="Plantão Extra">
                Plantão Extra
            </option>

            <option value="Solicitação de Transporte">
                Solicitação de Transporte
            </option>

        </select>


        <!-- ASSINATURA -->

        <label for="assinatura">
            Assine abaixo
        </label>

        <canvas id="assinatura"></canvas>


        <!-- DECLARAÇÃO -->

        <div class="declaracao">

            <input
                type="checkbox"
                id="aceite"
            >

            <label for="aceite">
                Declaro que esta assinatura é de minha autoria e que as informações enviadas são verdadeiras.
            </label>

        </div>


        <!-- MENSAGEM -->

        <div id="mensagem"></div>


        <!-- BOTÕES -->

        <div class="botoes">

            <button
                id="limpar"
                type="button"
            >
                Limpar
            </button>

            <button
                id="enviar"
                type="button"
            >
                Enviar
            </button>

        </div>

    </div>


    <!-- BIBLIOTECA DE ASSINATURA -->

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>


    <!-- JAVASCRIPT DO SISTEMA -->

    <script src="script.js"></script>

</body>

</html>
