```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#eef3f8">

    <title>Assinatura RH - UPA Madureira</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: #eef3f8;
            font-family: Arial, sans-serif;
        }

        /* CAIXA PRINCIPAL */

        .container {
            width: 94%;
            max-width: 500px;
            margin: 10px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }

        /* LOGO */

        .logo {
            display: block;
            margin: 0 auto 10px auto;
            width: 30%;
            max-width: 145px;
            min-width: 100px;
            height: auto;
        }

        /* TÍTULO */

        h2 {
            text-align: center;
            color: #555;
            font-size: 20px;
            margin: 0 0 8px 0;
        }

        /* DESCRIÇÃO */

        .descricao {
            text-align: center;
            color: #666;
            font-size: 15px;
            line-height: 20px;
            margin: 0 0 18px 0;
        }

        /* LABELS */

        label {
            display: block;
            font-weight: bold;
            color: #222;
            margin-bottom: 7px;
        }

        /* MATRÍCULA */

        #matricula {
            display: block;
            width: 100%;
            height: 44px;
            padding: 10px 14px;
            margin: 0 0 22px 0;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            background-color: #ffffff;
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
        }

        #matricula:focus {
            border-color: #0b5fa5;
        }

        /* TIPO DE DOCUMENTO */

        #tipoDocumento {
            display: block;
            width: 100%;
            height: 44px;
            padding: 10px 42px 10px 14px;
            margin: 0 0 22px 0;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            background-color: #ffffff;
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: normal;
            outline: none;
            cursor: pointer;

            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            background-image:
                linear-gradient(45deg, transparent 50%, #555 50%),
                linear-gradient(135deg, #555 50%, transparent 50%);

            background-position:
                calc(100% - 18px) 18px,
                calc(100% - 12px) 18px;

            background-size:
                6px 6px,
                6px 6px;

            background-repeat: no-repeat;
        }

        #tipoDocumento:focus {
            border-color: #0b5fa5;
        }

        /* ASSINATURA */

        canvas {
            display: block;
            width: 100%;
            height: 150px;
            margin-top: 8px;
            border: 2px solid #bdbdbd;
            border-radius: 10px;
            background-color: #ffffff;
            touch-action: none;
        }

        /* DECLARAÇÃO */

        .declaracao {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 12px 0;
            padding: 9px 10px;
            background-color: #f5f7fa;
            border: 1px solid #d8e1ea;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }

        .declaracao input {
            width: auto;
            margin-top: 3px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .declaracao label {
            margin: 0;
            font-weight: normal;
            line-height: 18px;
            color: #555;
        }

        /* MENSAGEM */

        #mensagem {
            display: none;
            margin: 10px 0;
            padding: 9px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }

        .erro {
            display: block !important;
            background: #ffe5e5;
            color: #a30000;
            border: 1px solid #ffb5b5;
        }

        .sucesso {
            display: block !important;
            background: #e8f8e8;
            color: #0b6b0b;
            border: 1px solid #b7e4b7;
        }

        /* BOTÕES */

        .botoes {
            display: flex;
            width: 100%;
            gap: 12px;
            margin-top: 12px;
        }

        button {
            flex: 1;
            width: 50%;
            height: 46px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #0b5fa5;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #084b84;
        }

        /* RODAPÉ MADUREIRA */

        .rodape {
            margin-top: 18px;
            padding-top: 10px;
            border-top: 1px solid #edf0f3;
            text-align: center;
            font-size: 10px;
            color: #a0a8b0;
            letter-spacing: 0.2px;
            font-weight: normal;
        }

        /* TELAS PEQUENAS */

        @media (max-width: 600px) and (max-height: 700px) {

            .container {
                padding: 14px 18px;
            }

            .logo {
                width: 27%;
                min-width: 90px;
                margin-bottom: 7px;
            }

            h2 {
                font-size: 19px;
                margin-bottom: 6px;
            }

            .descricao {
                font-size: 14px;
                line-height: 18px;
                margin-bottom: 14px;
            }

            #matricula {
                height: 40px;
                margin-bottom: 16px;
            }

            #tipoDocumento {
                height: 40px;
                margin-bottom: 16px;
            }

            canvas {
                height: 125px;
            }

            .declaracao {
                margin: 9px 0;
                padding: 8px;
                font-size: 12px;
            }

            .declaracao label {
                line-height: 16px;
            }

            #mensagem {
                margin: 8px 0;
                padding: 8px;
            }

            .botoes {
                margin-top: 9px;
            }

            button {
                height: 43px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <img
            src="logo.png"
            alt="Logo UPA Madureira"
            class="logo"
        >

        <!-- TÍTULO -->

        <h2>
            Assinatura Digital
        </h2>

        <!-- DESCRIÇÃO -->

        <p class="descricao">
            Assine para validar as informações enviadas
        </p>

        <!-- MATRÍCULA -->

        <label for="matricula">
            Matrícula
        </label>

        <input
            type="text"
            id="matricula"
            placeholder="Digite sua matrícula"
            autocomplete="off"
        >

        <!-- TIPO DE DOCUMENTO -->

        <label for="tipoDocumento">
            Tipo de Documento
        </label>

        <select
            id="tipoDocumento"
            required
        >

            <option value="" selected disabled>
                Selecione o tipo de documento
            </option>

            <option value="Plantão Extra">
                Plantão Extra
            </option>

            <option value="Solicitação de Transporte">
                Solicitação de Transporte
            </option>

        </select>

        <!-- ASSINATURA -->

        <label for="assinatura">
            Assine abaixo
        </label>

        <canvas id="assinatura"></canvas>

        <!-- DECLARAÇÃO -->

        <div class="declaracao">

            <input
                type="checkbox"
                id="aceite"
            >

            <label for="aceite">
                Declaro que esta assinatura é de minha autoria e que as informações enviadas são verdadeiras.
            </label>

        </div>

        <!-- MENSAGEM -->

        <div id="mensagem"></div>

        <!-- BOTÕES -->

        <div class="botoes">

            <button
                id="limpar"
                type="button"
            >
                Limpar
            </button>

            <button
                id="enviar"
                type="button"
            >
                Enviar
            </button>

        </div>

        <!-- CRÉDITOS -->

        <div class="rodape">
            Desenvolvido por Mariana Alves - Mat.: 40/4.057.919-3
        </div>

    </div>

    <!-- BIBLIOTECA DE ASSINATURA -->

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

    <!-- JAVASCRIPT DO SISTEMA -->

    <script src="script.js"></script>

</body>

</html>
