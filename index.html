        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background-color: #eef3f8;
            font-family: Arial, sans-serif;
        }

        /* CAIXA PRINCIPAL */

        .container {
            width: 94%;
            max-width: 500px;
            margin: 10px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }

        /* LOGO */

        .logo {
            display: block;
            margin: 0 auto 10px auto;
            width: 30%;
            max-width: 145px;
            min-width: 100px;
            height: auto;
        }

        /* TÍTULO */

        h2 {
            text-align: center;
            color: #555;
            font-size: 20px;
            margin: 0 0 8px 0;
        }

        /* DESCRIÇÃO */

        .descricao {
            text-align: center;
            color: #666;
            font-size: 15px;
            line-height: 20px;
            margin: 0 0 18px 0;
        }

        /* LABELS */

        label {
            display: block;
            font-weight: bold;
            color: #222;
            margin-bottom: 7px;
        }

        /* MATRÍCULA */

        #matricula {
            display: block;
            width: 100%;
            height: 44px;
            padding: 10px 14px;
            margin: 0 0 22px 0;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            background-color: #ffffff;
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
        }

        #matricula:focus {
            border-color: #0b5fa5;
        }

        /* TIPO DE DOCUMENTO */

        #tipoDocumento {
            display: block;
            width: 100%;
            height: 44px;
            padding: 10px 42px 10px 14px;
            margin: 0 0 22px 0;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            background-color: #ffffff;
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: normal;
            outline: none;
            cursor: pointer;

            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            background-image:
                linear-gradient(45deg, transparent 50%, #555 50%),
                linear-gradient(135deg, #555 50%, transparent 50%);

            background-position:
                calc(100% - 18px) 18px,
                calc(100% - 12px) 18px;

            background-size:
                6px 6px,
                6px 6px;

            background-repeat: no-repeat;
        }

        #tipoDocumento:focus {
            border-color: #0b5fa5;
        }

        /* ASSINATURA */

        canvas {
            display: block;
            width: 100%;
            height: 150px;
            margin-top: 8px;
            border: 2px solid #bdbdbd;
            border-radius: 10px;
            background-color: #ffffff;
            touch-action: none;
        }

        /* DECLARAÇÃO */

        .declaracao {

            background-color: #f5f7fa;
            border: 1px solid #d8e1ea;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
